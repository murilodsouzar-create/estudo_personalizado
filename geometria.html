<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Geometria - MathStudy</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>

<body>

<header>

    <nav class="navbar">

        <a href="../index.html" class="logo">
            Math<span>Study</span>
        </a>

    </nav>

</header>


<main class="calculator-page">

    <a href="../index.html" class="back">
        ← Voltar
    </a>

    <div class="calculator">

        <h1>📐 Geometria</h1>

        <p class="calculator-description">
            Calcule áreas, perímetros e volumes.
        </p>


        <div class="form-group">

            <label>Figura</label>

            <select id="figure">

                <option value="square">
                    Quadrado
                </option>

                <option value="rectangle">
                    Retângulo
                </option>

                <option value="triangle">
                    Triângulo
                </option>

                <option value="circle">
                    Círculo
                </option>

                <option value="cube">
                    Cubo
                </option>

                <option value="cylinder">
                    Cilindro
                </option>

            </select>

        </div>


        <div class="form-group">

            <label>Valor 1</label>

            <input
                type="number"
                id="value1"
            >

        </div>


        <div class="form-group">

            <label>Valor 2</label>

            <input
                type="number"
                id="value2"
            >

        </div>


        <button
            class="calculate-btn"
            id="calculate"
        >
            Calcular
        </button>


        <div
            class="result-box"
            id="result"
        ></div>

    </div>

</main>


<script src="../js/common.js"></script>
<script src="../js/geometria.js"></script>

</body>

</html>
