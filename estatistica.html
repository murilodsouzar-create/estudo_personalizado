    <!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Estatística - MathStudy</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

<header>

    <nav class="navbar">

        <a href="../index.html" class="logo">
            Math<span>Study</span>
        </a>

        <div class="nav-links">

            <a href="../index.html">
                Início
            </a>

        </div>

    </nav>

</header>


<main class="calculator-page">

    <a href="../index.html" class="back">
        ← Voltar
    </a>

    <div class="calculator">

        <h1>📊 Estatística</h1>

        <p class="calculator-description">
            Calcule média, mediana, moda, variância e desvio padrão.
        </p>

        <div class="form-group">

            <label>
                Digite os números separados por vírgula:
            </label>

            <input
                type="text"
                id="numbers"
                placeholder="Ex: 10, 20, 20, 30, 40"
            >

        </div>

        <button
            class="calculate-btn"
            id="calculate"
        >
            Calcular
        </button>

        <div
            class="result-box"
            id="result"
        ></div>

    </div>

</main>


<script src="../js/common.js"></script>
<script src="../js/estatistica.js"></script>

</body>

</html>
