<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MDC e MMC - MathStudy</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>

<body>

<header>

    <nav class="navbar">

        <a href="../index.html" class="logo">
            Math<span>Study</span>
        </a>

    </nav>

</header>


<main class="calculator-page">

    <a href="../index.html" class="back">
        ← Voltar
    </a>

    <div class="calculator">

        <h1>🔢 MDC e MMC</h1>

        <p class="calculator-description">
            Calcule o máximo divisor comum e o mínimo
            múltiplo comum.
        </p>


        <div class="form-group">

            <label>
                Primeiro número
            </label>

            <input
                type="number"
                id="a"
            >

        </div>


        <div class="form-group">

            <label>
                Segundo número
            </label>

            <input
                type="number"
                id="b"
            >

        </div>


        <button
            class="calculate-btn"
            id="calculate"
        >
            Calcular
        </button>


        <div
            class="result-box"
            id="result"
        ></div>

    </div>

</main>


<script src="../js/common.js"></script>
<script src="../js/mdc-mmc.js"></script>

</body>

</html>
