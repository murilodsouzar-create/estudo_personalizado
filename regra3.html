<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Regra de 3 - MathStudy</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

<header>

    <nav class="navbar">

        <a href="../index.html" class="logo">
            Math<span>Study</span>
        </a>

    </nav>

</header>


<main class="calculator-page">

    <a href="../index.html" class="back">
        ← Voltar
    </a>

    <div class="calculator">

        <h1>⚖️ Regra de 3</h1>

        <p class="calculator-description">
            Resolva uma regra de três simples.
        </p>

        <div class="form-group">

            <label>A</label>

            <input
                type="number"
                id="a"
            >

        </div>

        <div class="form-group">

            <label>B</label>

            <input
                type="number"
                id="b"
            >

        </div>

        <div class="form-group">

            <label>C</label>

            <input
                type="number"
                id="c"
            >

        </div>

        <button
            class="calculate-btn"
            id="calculate"
        >
            Calcular X
        </button>

        <div
            class="result-box"
            id="result"
        ></div>

    </div>

</main>


<script src="../js/common.js"></script>
<script src="../js/regra3.js"></script>

</body>

</html>
