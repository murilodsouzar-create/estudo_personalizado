<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Equação de 1º Grau - MathStudy</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>

<body>

<header>

    <nav class="navbar">

        <a href="../index.html" class="logo">
            Math<span>Study</span>
        </a>

    </nav>

</header>


<main class="calculator-page">

    <a href="../index.html" class="back">
        ← Voltar
    </a>

    <div class="calculator">

        <h1>𝑥 Equação de 1º Grau</h1>

        <p class="calculator-description">
            Resolva equações no formato ax + b = c.
        </p>


        <div class="form-group">

            <label>Valor de A</label>

            <input
                type="number"
                id="a"
                placeholder="Ex: 2"
            >

        </div>


        <div class="form-group">

            <label>Valor de B</label>

            <input
                type="number"
                id="b"
                placeholder="Ex: 5"
            >

        </div>


        <div class="form-group">

            <label>Valor de C</label>

            <input
                type="number"
                id="c"
                placeholder="Ex: 15"
            >

        </div>


        <button
            class="calculate-btn"
            id="calculate"
        >
            Resolver
        </button>


        <div
            class="result-box"
            id="result"
        ></div>

    </div>

</main>


<script src="../js/common.js"></script>
<script src="../js/equacao1.js"></script>

</body>

</html>
